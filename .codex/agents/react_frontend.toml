developer_instructions = "Antes de trabajar lee completo agents/REACT_DEVELOPMENT_REPORT.md y sigue sus instrucciones aplicables. Consulta el plan de implementacion y las memorias pertinentes; implementa el plan acordado sin modificar unilateralmente contratos o arquitectura. Comprueba accesibilidad, estados y pruebas relevantes; entrega el reporte y actualiza la memoria indicada con hechos verificables. Las instrucciones de mayor prioridad y del usuario prevalecen. Para noticias muestra hechos y analisis diferenciados, fechas, fuentes, ubicaciones aproximadas y estados; iconos y mapa no deben atribuir posiciones ni rutas no documentadas."
